# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name bilol-abdilxayev.colab.duke.edu;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name bilol-abdilxayev.colab.duke.edu;

    ssl_certificate /etc/letsencrypt/live/bilol-abdilxayev.colab.duke.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilol-abdilxayev.colab.duke.edu/privkey.pem;

    location / {
        proxy_pass http://bilol_abdilxayev:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}