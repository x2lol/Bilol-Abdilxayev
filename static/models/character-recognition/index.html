<h1>Character Recognition Demo</h1>

<p>
Draw a digit or letter in the grid below. The canvas is internally mapped to a
28×28 grid compatible with EMNIST/MNIST datasets.
</p>

<div class="recognition-layout">

<div class="canvas-panel">

<canvas id="canvas" width="280" height="280"></canvas>

<div class="controls">
<button onclick="clearCanvas()">Clear</button>

</div>
